name: deterministic-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -c requirements.lock
          python -m pip install --disable-pip-version-check "ruff>=0.6,<1" "mypy>=1.11,<2" "pip-audit>=2.7,<3" "coverage>=7.6,<8"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents orchestrator runtime shared scripts tests
      - name: Ruff static checks
        run: python -m ruff check orchestrator/scripts shared runtime scripts agents tests
      - name: Minimum static type check
        run: python -m mypy --config-file pyproject.toml
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt
      - name: Run hardening and deterministic regression tests (including persistence)
        run: python -m coverage run -m unittest discover -s tests -p "test_*.py" -v
      - name: Coverage measurement
        run: python -m coverage report
