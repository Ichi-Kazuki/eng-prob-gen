name: deterministic-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            pyproject.toml
      - name: Create isolated locked runtime environments
        id: runtime_envs
        shell: python
        run: |
          import os
          import pathlib
          import venv

          def create_environment(name):
              path = pathlib.Path(name)
              venv.EnvBuilder(with_pip=True).create(path)
              python = (path / "Scripts" / "python.exe") if os.name == "nt" else (path / "bin" / "python")
              site_packages = (path / "Lib" / "site-packages") if os.name == "nt" else (path / "lib" / "python3.11" / "site-packages")
              if os.name != "nt":
                  matches = list((path / "lib").glob("python*/site-packages"))
                  if len(matches) != 1:
                      raise RuntimeError(f"could not identify site-packages under {path}: {matches}")
                  site_packages = matches[0]
              return python, site_packages

          runtime_python, _ = create_environment(".ci-runtime")
          audit_python, audit_site_packages = create_environment(".ci-audit-runtime")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"runtime_python={runtime_python}\n")
              output.write(f"audit_python={audit_python}\n")
              output.write(f"audit_site_packages={audit_site_packages}\n")
      - name: Install locked runtime dependencies
        run: |
          "${{ steps.runtime_envs.outputs.runtime_python }}" -m pip install --disable-pip-version-check -r requirements.txt -c requirements.lock
          "${{ steps.runtime_envs.outputs.audit_python }}" -m pip install --disable-pip-version-check -r requirements.txt -c requirements.lock
      - name: Install CI tooling into test runtime
        run: |
          "${{ steps.runtime_envs.outputs.runtime_python }}" -m pip install --disable-pip-version-check "ruff>=0.6,<1" "mypy>=1.11,<2" "pip-audit>=2.7,<3" "coverage>=7.6,<8"
      - name: Verify installed runtime dependency closure
        run: |
          "${{ steps.runtime_envs.outputs.audit_python }}" -m pip freeze
          "${{ steps.runtime_envs.outputs.runtime_python }}" -m pip check
          "${{ steps.runtime_envs.outputs.audit_python }}" -m pip check
      - name: Compile Python sources
        run: "${{ steps.runtime_envs.outputs.runtime_python }}" -m compileall -q agents orchestrator runtime shared scripts tests
      - name: Ruff static checks
        run: "${{ steps.runtime_envs.outputs.runtime_python }}" -m ruff check orchestrator/scripts shared runtime scripts agents tests
      - name: Minimum static type check
        run: "${{ steps.runtime_envs.outputs.runtime_python }}" -m mypy --config-file pyproject.toml
      - name: Dependency audit (installed locked runtime environment)
        run: "${{ steps.runtime_envs.outputs.runtime_python }}" -m pip_audit --path "${{ steps.runtime_envs.outputs.audit_site_packages }}" --strict
      - name: Run hardening and deterministic regression tests (including persistence)
        run: "${{ steps.runtime_envs.outputs.runtime_python }}" -m coverage run -m unittest discover -s tests -p "test_*.py" -v
      - name: Coverage measurement
        run: "${{ steps.runtime_envs.outputs.runtime_python }}" -m coverage report
